name: Tests and evals

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morningbrief
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE: host=localhost dbname=morningbrief user=postgres password=postgres
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Start the app
        run: |
          uvicorn app:app &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8000/docs > /dev/null && break; sleep 1; done
      - name: Run tests and evals
        run: python tests.py
